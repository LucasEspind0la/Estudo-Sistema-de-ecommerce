spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://localhost:5432/loja_db
    username: postgres
    password: "123"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Configurações de Upload de Arquivos (unificado dentro do bloco spring)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# Configurações personalizadas da aplicação (apenas UM bloco app)
app:
  jwt:
    chave-secreta: minha-chave-super-secreta-que-deve-ser-bem-grande-e-aleatoria-pelo-menos-256-bits-123456
    expiracao-ms: 86400000
  upload:
    diretorio: ./uploads
    subdiretorio-produtos: produtos

server:
  port: 8080